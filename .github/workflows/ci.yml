name: CI

on:
  push:
  pull_request:

jobs:
  # Compilateur et Bridge : sans dépendance npm. Windows est inclus car les chemins
  # et les scripts visent d'abord ce système.
  node-components:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - name: Tests du compilateur
        working-directory: compiler
        run: npm test
      - name: Tests du Bridge
        working-directory: bridge
        run: node --test tests/*.test.mjs

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      # Remplacer par « npm ci » une fois package-lock.json ajouté au dépôt.
      - name: Installer les dépendances
        working-directory: studio
        run: npm install
      - name: Tests
        working-directory: studio
        run: npm test
      - name: Vérification TypeScript
        working-directory: studio
        run: npm run typecheck
      - name: Build de production
        working-directory: studio
        run: npm run build

  # Dépôt des bibliothèques (libraries-repo/ → publié dans berkios-code) : le catalogue doit se construire.
  libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - name: Construire le catalogue et tester
        working-directory: libraries-repo
        run: |
          node scripts/build-release.mjs
          node --test "tests/*.test.mjs"

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - name: Cohérence des versions et de la documentation
        run: node scripts/check-consistency.mjs
